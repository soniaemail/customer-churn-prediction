[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long lines are tolerated in Streamlit layout code

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets a bare `pytest` import the `src` package
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning"]
